name: safewalk
description: "SafeWalk campus safety app for USM students and staff (CAT304 Group 12)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  battery_plus: ^7.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  go_router: ^18.1.3
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  socket_io_client: ^3.1.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Wix Madefor (SIL Open Font License, assets/fonts/OFL.txt): the Dusk theme's faces.
  fonts:
    - family: WixMadeforDisplay
      fonts:
        - asset: assets/fonts/WixMadeforDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/WixMadeforDisplay-SemiBold.ttf
          weight: 600
    - family: WixMadeforText
      fonts:
        - asset: assets/fonts/WixMadeforText-Regular.ttf
          weight: 400
        - asset: assets/fonts/WixMadeforText-Medium.ttf
          weight: 500
        - asset: assets/fonts/WixMadeforText-SemiBold.ttf
          weight: 600
